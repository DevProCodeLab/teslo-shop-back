# ═══════════════════════════════════════════════════════════════════════════
# CI — Integración continua
#
# Se ejecuta en cada Pull Request hacia main y en cada push a main.
# Su única responsabilidad es RESPONDER SÍ O NO a: "¿este código es mergeable?"
# No publica nada ni despliega nada (eso es release.yml).
# ═══════════════════════════════════════════════════════════════════════════

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancela ejecuciones anteriores del mismo PR o rama. Si empujas tres commits
# seguidos, sólo el último consume runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: este workflow sólo necesita leer el código.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Gate de calidad estática: formato, lint y compilación.
  # Va primero porque es el más rápido y el que falla más seguido.
  # ─────────────────────────────────────────────────────────────────────────
  quality:
    name: Formato, lint y build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Cachea ~/.npm usando package-lock.json como clave. En runs
          # posteriores `npm ci` baja de ~40s a unos pocos segundos.
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Orden deliberado: lo barato y determinista primero.
      - name: Verificar formato (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Compilar
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────
  # Tests unitarios: sin base de datos, corren en paralelo con `quality`.
  # ─────────────────────────────────────────────────────────────────────────
  test-unit:
    name: Tests unitarios
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests con cobertura
        run: npm run test:ci

      - name: Publicar reporte de cobertura
        # Se sube incluso si los tests fallan: el reporte es justo lo que
        # necesitas para diagnosticar la falla.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────
  # Tests end-to-end contra una base de datos Postgres real y efímera.
  # Depende de `quality` para no gastar un Postgres si el código ni compila.
  # ─────────────────────────────────────────────────────────────────────────
  test-e2e:
    name: Tests e2e (Postgres)
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 15

    # Service containers: GitHub levanta estos contenedores junto al runner y
    # los expone en localhost. Se destruyen al terminar el job, así que cada
    # ejecución arranca con una base de datos limpia.
    services:
      postgres:
        image: postgres:14.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teslo_test
        ports:
          - 5432:5432
        # Sin healthcheck el job arrancaría los tests antes de que Postgres
        # acepte conexiones: es la causa #1 de e2e intermitentes en CI.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # ConfigModule.forRoot() en src/app.module.ts lee .env, que no existe en el
    # runner. Las variables de entorno del proceso tienen precedencia, así que
    # la configuración de test se inyecta desde aquí.
    env:
      STAGE: dev
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: teslo_test
      PORT: 3000
      HOST_API: http://localhost:3000/api
      JWT_SECRET: jwt-secret-solo-para-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # TypeORM corre con synchronize: true (src/app.module.ts), así que crea
      # el esquema solo al conectar. No hacen falta migraciones aquí.
      - name: Ejecutar tests e2e
        run: npm run test:e2e

  # ─────────────────────────────────────────────────────────────────────────
  # Valida que la imagen se construye, SIN publicarla. Publicar es trabajo de
  # release.yml; aquí sólo queremos enterarnos en el PR si el Dockerfile rompe.
  # ─────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Verificar build de Docker
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen (sin push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: teslo-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
